# Mosquitto 2.x. Sin acceso anónimo: se exige usuario/contraseña (archivo "passwd").
persistence true
persistence_location /mosquitto/data/

allow_anonymous false
password_file /mosquitto/config/passwd

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# El compose publica ambos puertos solo en 127.0.0.1. Para exponerlo en la red,
# configura TLS (cafile/certfile/keyfile) y un listener 8883; no abras 1883 en claro.
