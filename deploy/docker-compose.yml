# Uso (desde la raíz del repo):
#   export HERBAL_DB_URL="https://TU-PROYECTO-default-rtdb.firebaseio.com"
#   export HERBAL_API_KEY="..."  HERBAL_USER_EMAIL="viewer@..."  HERBAL_USER_PASSWORD="..."
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm trainer
# El modelo (y su .sha256) quedan en ./output -> cópialos a app/src/main/assets/ y versiona ambos.
#
# Broker MQTT opcional (el proyecto hoy usa Firebase, no MQTT). Solo escucha en 127.0.0.1 y exige
# usuario/contraseña; ver deploy/mosquitto/README.md para crear el archivo de contraseñas:
#   docker compose -f deploy/docker-compose.yml --profile mqtt up -d mqtt-broker

name: control-herbal

services:
  trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: control-herbal-trainer:latest
    container_name: control-herbal-trainer
    environment:
      HERBAL_DB_URL: ${HERBAL_DB_URL:?Define HERBAL_DB_URL (https://<proyecto>-default-rtdb.firebaseio.com)}
      HERBAL_API_KEY: ${HERBAL_API_KEY:?Define HERBAL_API_KEY}
      HERBAL_USER_EMAIL: ${HERBAL_USER_EMAIL:?Define HERBAL_USER_EMAIL (cuenta con rol viewer)}
      HERBAL_USER_PASSWORD: ${HERBAL_USER_PASSWORD:?Define HERBAL_USER_PASSWORD}
      MODEL_OUTPUT_PATH: /app/output/herbal_model.tflite
      HOME: /tmp
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../output:/app/output
    restart: "no"

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: control-herbal-mqtt
    profiles: ["mqtt"]
    ports:
      - "127.0.0.1:1883:1883"   # MQTT, solo loopback
      - "127.0.0.1:9001:9001"   # MQTT sobre WebSockets, solo loopback
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  mosquitto-data:
