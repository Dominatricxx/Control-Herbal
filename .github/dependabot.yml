version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
  - package-ecosystem: "pip"
    directory: "/ml"
    schedule: { interval: "weekly" }
  - package-ecosystem: "npm"
    directory: "/firebase"
    schedule: { interval: "weekly" }
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule: { interval: "weekly" }
