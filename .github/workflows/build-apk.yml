name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "assets/**"
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (Debug) + pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validar wrapper de Gradle
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure google-services.json configuration exists
        run: |
          if [ ! -f app/google-services.json ]; then
            cp app/goo gle-services.json.example app/google-services.json
          fi
          if [ ! -f wear/google-services.json ]; then
            cp wear/google-services.json.example wear/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pruebas unitarias
        run: ./gradlew :app:testDebugUnitTest

      - name: Build APK with Gradle
        run: ./gradlew :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
