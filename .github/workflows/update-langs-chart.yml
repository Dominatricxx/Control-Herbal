name: Update languages chart

on:
  push:
    branches: [main]
    # evita que el propio commit del chart vuelva a disparar el workflow
    paths-ignore:
      - "assets/control-herbal-languages-chart.svg"
  schedule:
    # refresco semanal aunque no haya push (corrige cualquier desfase de la API)
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-langs-chart
  cancel-in-progress: true

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true   # necesario para hacer push del SVG regenerado

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # GitHub (Linguist) recalcula las estadísticas de lenguajes de forma asíncrona
      # tras cada push. Sin esta espera, la API devuelve los datos del commit anterior.
      - name: Esperar a que GitHub actualice las estadísticas
        if: github.event_name == 'push'
        run: sleep 60

      - name: Regenerate chart SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_langs_chart.py "${{ github.repository }}" assets/control-herbal-languages-chart.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- assets/control-herbal-languages-chart.svg; then
            git add assets/control-herbal-languages-chart.svg
            git commit -m "chore: actualizar chart de lenguajes automaticamente"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "Sin cambios en el chart, no se hace commit."
          fi
