name: CI Control-Herbal

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Principio de mínimo privilegio: el token solo puede leer el repositorio.
permissions:
  contents: read

jobs:
  docker:
    name: Docker build + validación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validar docker-compose
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          HERBAL_DB_URL: https://ci-placeholder-default-rtdb.firebaseio.com
          HERBAL_API_KEY: ci-placeholder
          HERBAL_USER_EMAIL: ci@example.invalid
          HERBAL_USER_PASSWORD: ci-placeholder

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: control-herbal-trainer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar que las dependencias se importan dentro del contenedor
        run: |
          docker run --rm control-herbal-trainer:test \
            python -c "import requests, pandas, numpy, sklearn, tensorflow as tf; print('OK, TensorFlow', tf.__version__)"

      - name: Verificar que el script falla con mensaje claro sin credenciales
        run: |
          set +e
          docker run --rm control-herbal-trainer:test python ml/train_herbal_model.py
          code=$?
          [ "$code" -eq 1 ] && echo "Salida esperada (1) sin credenciales" || { echo "Código inesperado: $code"; exit 1; }

  firebase-rules:
    name: Tests de reglas de Realtime Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Java (requerido por el emulador)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar dependencias y ejecutar tests
        working-directory: firebase
        run: |
          npm install --no-audit --no-fund
          npm test

  python-checks:
    name: Verificación del script de entrenamiento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m py_compile ml/train_herbal_model.py scripts/generate_langs_chart.py
