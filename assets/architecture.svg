<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F17"/>
      <stop offset="100%" stop-color="#16331F"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#8FD14F" opacity="0.15"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="300" rx="16" fill="url(#boardBg)"/>
  <rect width="600" height="300" rx="16" fill="url(#grid)"/>

  <!-- lineas base (cableado estatico) -->
  <g fill="none" stroke="#3E5A3E" stroke-width="2">
    <path id="p1" d="M92,150 L185,150 L185,80 L278,80"/>
    <path id="p2" d="M92,150 L185,150 L185,220 L278,220"/>
    <path id="p3" d="M322,80 L415,80 L415,150 L508,150"/>
    <path id="p4" d="M322,220 L415,220 L415,150 L508,150"/>
  </g>

  <!-- vias (puntos de union) -->
  <g fill="#C9A227">
    <circle cx="185" cy="150" r="2.5"/>
    <circle cx="185" cy="80" r="2.5"/>
    <circle cx="185" cy="220" r="2.5"/>
    <circle cx="415" cy="80" r="2.5"/>
    <circle cx="415" cy="220" r="2.5"/>
    <circle cx="415" cy="150" r="2.5"/>
  </g>

  <!-- luces viajando por cada linea -->
  <circle r="4.5" fill="#F2C14E" filter="url(#glow)">
    <animateMotion dur="2.4s" repeatCount="indefinite">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#F2C14E" filter="url(#glow)">
    <animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#8FD14F" filter="url(#glow)">
    <animateMotion dur="2s" begin="1.1s" repeatCount="indefinite">
      <mpath href="#p3"/>
    </animateMotion>
  </circle>
  <circle r="4.5" fill="#8FD14F" filter="url(#glow)">
    <animateMotion dur="2s" begin="1.5s" repeatCount="indefinite">
      <mpath href="#p4"/>
    </animateMotion>
  </circle>

  <!-- nodo: ESP32 + Sensores -->
  <g transform="translate(70,150)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#14301F" stroke="#7AA240" stroke-width="1.5"/>
    <g transform="translate(-9,-9)" stroke="#8FD14F" stroke-width="1.6" fill="none">
      <rect x="2" y="2" width="14" height="14" rx="2"/>
      <line x1="0" y1="6" x2="2" y2="6"/><line x1="0" y1="10" x2="2" y2="10"/>
      <line x1="16" y1="6" x2="18" y2="6"/><line x1="16" y1="10" x2="18" y2="10"/>
      <line x1="6" y1="0" x2="6" y2="2"/><line x1="10" y1="0" x2="10" y2="2"/>
      <line x1="6" y1="16" x2="6" y2="18"/><line x1="10" y1="16" x2="10" y2="18"/>
    </g>
    <text x="0" y="42" text-anchor="middle" font-family="'Fira Code',monospace" font-size="12" fill="#9FCB8C">ESP32 + Sensores</text>
  </g>

  <!-- nodo: Firebase -->
  <g transform="translate(300,80)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#14301F" stroke="#7AA240" stroke-width="1.5"/>
    <g transform="translate(-8,-8)" stroke="#8FD14F" stroke-width="1.6" fill="none">
      <ellipse cx="8" cy="3" rx="8" ry="3"/>
      <path d="M0,3 L0,13 C0,14.6 3.6,16 8,16 C12.4,16 16,14.6 16,13 L16,3"/>
      <path d="M0,8 C0,9.6 3.6,11 8,11 C12.4,11 16,9.6 16,8" opacity="0.6"/>
    </g>
    <text x="0" y="42" text-anchor="middle" font-family="'Fira Code',monospace" font-size="12" fill="#9FCB8C">Firebase Realtime DB</text>
  </g>

  <!-- nodo: entrenamiento IA -->
  <g transform="translate(300,220)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#14301F" stroke="#7AA240" stroke-width="1.5"/>
    <g transform="translate(-9,-9)" stroke="#8FD14F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2,4 L7,9 L2,14"/>
      <line x1="9" y1="15" x2="16" y2="15"/>
    </g>
    <text x="0" y="42" text-anchor="middle" font-family="'Fira Code',monospace" font-size="12" fill="#9FCB8C">Entrenamiento IA</text>
  </g>

  <!-- nodo: app multiplataforma -->
  <g transform="translate(530,150)">
    <rect x="-22" y="-22" width="44" height="44" rx="10" fill="#14301F" stroke="#C9A227" stroke-width="1.8"/>
    <g transform="translate(-6,-9)" stroke="#F2C14E" stroke-width="1.6" fill="none">
      <rect x="0" y="0" width="12" height="18" rx="2"/>
      <line x1="4" y1="15" x2="8" y2="15"/>
    </g>
    <text x="0" y="42" text-anchor="middle" font-family="'Fira Code',monospace" font-size="12" fill="#F2C14E">App (Android · Wear · Desktop)</text>
  </g>
</svg>
