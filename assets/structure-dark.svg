  <text class="nm" x="150" y="211" font-weight="700" fill="#e6edf3">database/</text><text class="cm" x="410" y="211" fill="#9198a1">Room: plantas, lecturas y DAOs</text>
  <text class="nm" x="150" y="243" font-weight="700" fill="#e6edf3">logic/</text><text class="cm" x="410" y="243" fill="#9198a1">PredictiveTheorem: métricas de estrés</text>
  <text class="nm" x="150" y="275" font-weight="700" fill="#e6edf3">sync/</text><text class="cm" x="410" y="275" fill="#9198a1">Servicio foreground y workers</text>
  <text class="nm" x="150" y="307" font-weight="700" fill="#e6edf3">ui/theme/</text><text class="cm" x="410" y="307" fill="#9198a1">Paleta, tipografía y tema</text>
  <text class="nm" x="150" y="339" font-weight="700" fill="#e6edf3">widget/</text><text class="cm" x="410" y="339" fill="#9198a1">Widgets de estado y alertas</text>
  <text class="nm" x="150" y="371" font-weight="400" fill="#e6edf3">MainActivity.kt</text><text class="cm" x="410" y="371" fill="#9198a1">Dashboard principal</text>
  <text class="nm" x="150" y="403" font-weight="400" fill="#e6edf3">ChatActivity.kt</text><text class="cm" x="410" y="403" fill="#9198a1">Asistente Herbal AI</text>
  <text class="nm" x="150" y="435" font-weight="400" fill="#e6edf3">HistoryActivity.kt</text><text class="cm" x="410" y="435" fill="#9198a1">Registros diario / semanal / mensual</text>
  <text class="nm" x="150" y="467" font-weight="400" fill="#e6edf3">PlantSetupActivity.kt</text><text class="cm" x="410" y="467" fill="#9198a1">Configuración de plantas</text>
  <text class="nm" x="150" y="499" font-weight="400" fill="#e6edf3">SensorViewModel.kt</text><text class="cm" x="410" y="499" fill="#9198a1">Estado en vivo y análisis</text>
  <text class="nm" x="120" y="531" font-weight="400" fill="#e6edf3">AndroidManifest.xml</text><text class="cm" x="410" y="531" fill="#9198a1">Manifiesto de la app</text>
  <text class="nm" x="120" y="563" font-weight="700" fill="#e6edf3">res/</text><text class="cm" x="410" y="563" fill="#9198a1">Layouts, drawables, valores y menús</text>
