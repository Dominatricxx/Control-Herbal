  <text class="nm" x="60" y="627" font-weight="700" fill="#e6edf3">capturas/</text><text class="cm" x="410" y="627" fill="#9198a1">Capturas Android · Wear OS · Desktop</text>
  <text class="nm" x="60" y="659" font-weight="700" fill="#e6edf3">wear/</text><text class="cm" x="410" y="659" fill="#9198a1">App Wear OS</text>
  <text class="nm" x="60" y="691" font-weight="700" fill="#e6edf3">desktop/</text><text class="cm" x="410" y="691" fill="#9198a1">App de escritorio (JVM)</text>
  <text class="nm" x="60" y="723" font-weight="700" fill="#e6edf3">common/</text><text class="cm" x="410" y="723" fill="#9198a1">Lógica y UI compartida (Kotlin Multiplatform)</text>
  <text class="nm" x="60" y="755" font-weight="700" fill="#e6edf3">gradle/</text><text class="cm" x="410" y="755" fill="#9198a1">Wrapper de Gradle</text>
