  <text class="nm" x="30" y="51" font-weight="700" fill="#3ddc97">ControlHerbal/</text>
  <text class="nm" x="60" y="83" font-weight="700" fill="#e6edf3">app/</text><text class="cm" x="410" y="83" fill="#9198a1">App Android</text>
  <text class="nm" x="90" y="115" font-weight="700" fill="#e6edf3">src/main/</text><text class="cm" x="410" y="115" fill="#9198a1">Código fuente y recursos principales</text>
  <text class="nm" x="120" y="147" font-weight="700" fill="#e6edf3">java/com/example/controlherbal/</text><text class="cm" x="410" y="147" fill="#9198a1">Paquete principal de la app</text>
