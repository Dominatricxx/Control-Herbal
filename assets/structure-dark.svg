    <text class="nm" x="30" y="51" font-weight="700" fill="#3ddc97">ControlHerbal/</text>
  <text class="nm" x="60" y="83" font-weight="700" fill="#e6edf3">app/</text><text class="cm" x="440" y="83" fill="#9198a1">App Android</text>
  <text class="nm" x="90" y="115" font-weight="700" fill="#e6edf3">src/main/</text><text class="cm" x="440" y="115" fill="#9198a1">Código fuente y recursos principales</text>
  <text class="nm" x="120" y="147" font-weight="700" fill="#e6edf3">java/com/example/controlherbal/</text><text class="cm" x="440" y="147" fill="#9198a1">Paquete principal de la app</text>
  <text class="nm" x="150" y="179" font-weight="700" fill="#e6edf3">ai/</text><text class="cm" x="440" y="179" fill="#9198a1">HerbalAI: modelo TFLite y aprendizaje</text>
  <text class="nm" x="150" y="211" font-weight="700" fill="#e6edf3">common/</text><text class="cm" x="440" y="211" fill="#9198a1">Constantes, utilidades de seguridad y logger</text>
  <text class="nm" x="150" y="243" font-weight="700" fill="#e6edf3">data/database/</text><text class="cm" x="440" y="243" fill="#9198a1">Room: plantas, lecturas y DAOs</text>
  <text class="nm" x="150" y="275" font-weight="700" fill="#e6edf3">data/sync/</text><text class="cm" x="440" y="275" fill="#9198a1">Servicio foreground y workers</text>
  <text class="nm" x="150" y="307" font-weight="700" fill="#e6edf3">domain/logic/</text><text class="cm" x="440" y="307" fill="#9198a1">PredictiveTheorem: métricas de estrés</text>
  <text class="nm" x="150" y="339" font-weight="700" fill="#e6edf3">ui/activities/</text><text class="cm" x="440" y="339" fill="#9198a1">Dashboard, chat, historial y configuración</text>
  <text class="nm" x="150" y="371" font-weight="700" fill="#e6edf3">ui/theme/</text><text class="cm" x="440" y="371" fill="#9198a1">Paleta, tipografía y tema</text>
  <text class="nm" x="150" y="403" font-weight="700" fill="#e6edf3">ui/viewmodel/</text><text class="cm" x="440" y="403" fill="#9198a1">SensorViewModel: estado en vivo y análisis</text>
  <text class="nm" x="150" y="435" font-weight="700" fill="#e6edf3">ui/widget/</text><text class="cm" x="440" y="435" fill="#9198a1">Widgets de estado y alertas</text>
  <text class="nm" x="120" y="467" font-weight="700" fill="#e6edf3">res/</text><text class="cm" x="440" y="467" fill="#9198a1">Layouts, drawables, valores y menús</text>
  <text class="nm" x="120" y="499" font-weight="400" fill="#e6edf3">AndroidManifest.xml</text><text class="cm" x="440" y="499" fill="#9198a1">Manifiesto de la app</text>
  <text class="nm" x="60" y="531" font-weight="700" fill="#e6edf3">wear/</text><text class="cm" x="440" y="531" fill="#9198a1">App Wear OS</text>
  <text class="nm" x="60" y="563" font-weight="700" fill="#e6edf3">desktop/</text><text class="cm" x="440" y="563" fill="#9198a1">App de escritorio (Compose JVM)</text>
  <text class="nm" x="60" y="595" font-weight="700" fill="#e6edf3">common/</text><text class="cm" x="440" y="595" fill="#9198a1">Librería Android compartida (Room)</text>
  <text class="nm" x="60" y="627" font-weight="700" fill="#e6edf3">firmware/</text><text class="cm" x="440" y="627" fill="#9198a1">Código del microcontrolador</text>
  <text class="nm" x="90" y="659" font-weight="400" fill="#e6edf3">ControlHerbal.ino</text><text class="cm" x="440" y="659" fill="#9198a1">ESP32: sensores + IRH + Firebase</text>
  <text class="nm" x="60" y="691" font-weight="700" fill="#e6edf3">ml/</text><text class="cm" x="440" y="691" fill="#9198a1">Pipeline de entrenamiento de IA</text>
  <text class="nm" x="90" y="723" font-weight="400" fill="#e6edf3">train_herbal_model.py</text><text class="cm" x="440" y="723" fill="#9198a1">Entrenamiento (TensorFlow → TFLite)</text>
  <text class="nm" x="90" y="755" font-weight="400" fill="#e6edf3">requirements.txt</text><text class="cm" x="440" y="755" fill="#9198a1">Dependencias de Python</text>
  <text class="nm" x="60" y="787" font-weight="700" fill="#e6edf3">deploy/</text><text class="cm" x="440" y="787" fill="#9198a1">Contenedores Docker</text>
  <text class="nm" x="90" y="819" font-weight="400" fill="#e6edf3">Dockerfile</text><text class="cm" x="440" y="819" fill="#9198a1">Imagen del entrenamiento</text>
  <text class="nm" x="90" y="851" font-weight="400" fill="#e6edf3">docker-compose.yml</text><text class="cm" x="440" y="851" fill="#9198a1">trainer + broker MQTT opcional</text>
  <text class="nm" x="90" y="883" font-weight="400" fill="#e6edf3">mosquitto/mosquitto.conf</text><text class="cm" x="440" y="883" fill="#9198a1">Configuración del broker MQTT</text>
  <text class="nm" x="60" y="915" font-weight="700" fill="#e6edf3">scripts/</text><text class="cm" x="440" y="915" fill="#9198a1">Automatizaciones</text>
  <text class="nm" x="90" y="947" font-weight="400" fill="#e6edf3">generate_langs_chart.py</text><text class="cm" x="440" y="947" fill="#9198a1">Genera el gráfico de lenguajes</text>
  <text class="nm" x="60" y="979" font-weight="700" fill="#e6edf3">.github/workflows/</text><text class="cm" x="440" y="979" fill="#9198a1">CI/CD con GitHub Actions</text>
  <text class="nm" x="90" y="1011" font-weight="400" fill="#e6edf3">ci.yml</text><text class="cm" x="440" y="1011" fill="#9198a1">Build de Docker + validaciones</text>
  <text class="nm" x="90" y="1043" font-weight="400" fill="#e6edf3">update-langs-chart.yml</text><text class="cm" x="440" y="1043" fill="#9198a1">Actualiza el gráfico de lenguajes</text>
  <text class="nm" x="60" y="1075" font-weight="700" fill="#e6edf3">assets/</text><text class="cm" x="440" y="1075" fill="#9198a1">Diagramas SVG y gráfico de lenguajes</text>
  <text class="nm" x="60" y="1107" font-weight="700" fill="#e6edf3">capturas/</text><text class="cm" x="440" y="1107" fill="#9198a1">Capturas Android · Wear OS · Desktop</text>
  <text class="nm" x="60" y="1139" font-weight="700" fill="#e6edf3">docs/screenshots/</text><text class="cm" x="440" y="1139" fill="#9198a1">Capturas de la documentación</text>
  <text class="nm" x="60" y="1171" font-weight="700" fill="#e6edf3">output/</text><text class="cm" x="440" y="1171" fill="#9198a1">Modelo .tflite generado por Docker</text>
  <text class="nm" x="60" y="1203" font-weight="700" fill="#e6edf3">gradle/</text><text class="cm" x="440" y="1203" fill="#9198a1">Wrapper y catálogo de versiones</text>
  <text class="nm" x="60" y="1235" font-weight="400" fill="#e6edf3">build.gradle.kts</text><text class="cm" x="440" y="1235" fill="#9198a1">Configuración del build</text>
  <text class="nm" x="60" y="1267" font-weight="400" fill="#e6edf3">settings.gradle.kts</text><text class="cm" x="440" y="1267" fill="#9198a1">Módulos: app · wear · desktop · common</text>
</svg>
